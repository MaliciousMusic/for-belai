<!doctype html>
<html lang="en">

<meta property="og:description" content="Congratulations on your new job ♥">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* single light look on purpose: studio wall + plinth */
:root{--bg1:#fbf4ef;--bg2:#f7e6ee;--bg3:#cdd0ee;--glow:rgba(255,186,214,.6);--ink:#8a2453;--pill:rgba(255,255,255,.62);--pill-b:rgba(138,36,83,.18);color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 58%,var(--bg3) 100%);background-color:var(--bg1);color:var(--ink);font-family:"Playfair Display",Georgia,serif;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#glow{position:fixed;inset:0;background:radial-gradient(ellipse 55% 42% at 50% 40%,var(--glow),transparent 72%);pointer-events:none;animation:gl 2.4s ease-out both}
@keyframes gl{from{opacity:0}to{opacity:1}}
.L{position:fixed;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.sway.on{animation:bs 9s ease-in-out infinite}
@keyframes bs{0%,100%{transform:rotate(0)}25%{transform:rotate(.45deg)}75%{transform:rotate(-.45deg)}}
.rt{font-family:"Playfair Display",Georgia,serif;font-style:italic;font-weight:500}
.rs{font-family:"Great Vibes","Snell Roundhand","Brush Script MT",cursive}
.hz{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#hf{z-index:5}
.h{position:absolute;left:0;top:0;will-change:transform}
.h i{display:block;width:100%;height:100%;animation:sw var(--sw) ease-in-out infinite alternate}
.h svg{display:block;width:100%;height:100%;animation:fl var(--fl) linear infinite}
@keyframes sw{from{transform:translateX(calc(var(--a) * -1)) rotate(-16deg)}to{transform:translateX(var(--a)) rotate(16deg)}}
@keyframes fl{to{transform:rotateY(360deg)}}
#ui{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:6;pointer-events:none}
#ui button{pointer-events:auto;font:italic 500 15px/1 "Playfair Display",Georgia,serif;color:var(--ink);background:var(--pill);border:1px solid var(--pill-b);border-radius:999px;padding:10px 18px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;transform:translateY(10px);transition:opacity .8s,transform .8s;cursor:pointer}
#ui button.show{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.sway.on,.h i,.h svg{animation:none}}
</style>
</head>
<body>
<div id="glow"></div>
<div id="hb" class="hz"></div>
<svg class="L" id="s0" viewBox="0 0 1000 1300" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><defs id="defs"></defs><g id="Lped"></g></svg>
<svg class="L sway" id="s1" viewBox="0 0 1000 1300" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><g id="Lstem"></g><g id="Lback"></g><g id="Lmid"></g></svg>
<svg class="L" id="s2" viewBox="0 0 1000 1300" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><g id="Lvase"></g></svg>
<svg class="L sway" id="s3" viewBox="0 0 1000 1300" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><g id="Lstem2"></g><g id="Lfront"></g></svg>
<svg class="L" id="s4" viewBox="0 0 1000 1300" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Congratulations on your new job, Belai my love"><g id="Lrib"></g></svg>
<div id="hf" class="hz"></div>
<div id="ui"><button id="replay" type="button">↺ replay</button></div>
<script>
/* ---------- core helpers ---------- */
const NS='http://www.w3.org/2000/svg';
const $=id=>document.getElementById(id);
function E(t,a,p){const e=document.createElementNS(NS,t);if(a)for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
const G=(p,a)=>E('g',a,p);
let seed=11;
function rnd(){seed=(seed*16807)%2147483647;return(seed-1)/2147483646}
const R=(a,b)=>a+(b-a)*rnd();
const pick=a=>a[Math.floor(rnd()*a.length)];
const MR=(a,b)=>a+(b-a)*Math.random();
const f=n=>Math.round(n*10)/10;
const D=Math.PI/180;

/* ---------- gradients (cached) ---------- */
const defs=$('defs');let gid=0;const gc={};
function stops(g,s){s.forEach((c,i)=>{const o=Array.isArray(c)?c:[i/(s.length-1),c];E('stop',{offset:o[0],'stop-color':o[1],'stop-opacity':o[2]??1},g)})}
function lin(s,x1=0,y1=1,x2=0,y2=0){const k='l'+JSON.stringify(s)+[x1,y1,x2,y2];if(gc[k])return gc[k];const id='g'+(gid++);stops(E('linearGradient',{id,x1,y1,x2,y2},defs),s);return gc[k]=`url(#${id})`}
function rad(s,cx=.5,cy=.5,r=.5,fx=cx,fy=cy){const k='r'+JSON.stringify(s)+[cx,cy,r,fx,fy];if(gc[k])return gc[k];const id='g'+(gid++);stops(E('radialGradient',{id,cx,cy,r,fx,fy},defs),s);return gc[k]=`url(#${id})`}
function radU(s,r){const k='u'+JSON.stringify(s)+r;if(gc[k])return gc[k];const id='g'+(gid++);stops(E('radialGradient',{id,cx:0,cy:0,r,gradientUnits:'userSpaceOnUse'},defs),s);return gc[k]=`url(#${id})`}

/* ---------- geometry ---------- */
function bz(P,t){const u=1-t;return[u*u*u*P[0][0]+3*u*u*t*P[1][0]+3*u*t*t*P[2][0]+t*t*t*P[3][0],u*u*u*P[0][1]+3*u*u*t*P[1][1]+3*u*t*t*P[2][1]+t*t*t*P[3][1]]}
/* filled ribbon along a cubic bezier, half-width wf(t) */
function taper(P,wf,n=20){const A=[],B=[];for(let i=0;i<=n;i++){const t=i/n,p=bz(P,t),q=bz(P,Math.min(1,t+.02)),o=bz(P,Math.max(0,t-.02));const dx=q[0]-o[0],dy=q[1]-o[1],l=Math.hypot(dx,dy)||1,w=typeof wf=='function'?wf(t):wf*(1-t);A.push(f(p[0]-dy/l*w)+','+f(p[1]+dx/l*w));B.push(f(p[0]+dy/l*w)+','+f(p[1]-dx/l*w))}return'M'+A.join('L')+'L'+B.reverse().join('L')+'Z'}
const cp=P=>`M${f(P[0][0])},${f(P[0][1])}C${f(P[1][0])},${f(P[1][1])} ${f(P[2][0])},${f(P[2][1])} ${f(P[3][0])},${f(P[3][1])}`;
/* petals: base at 0,0 pointing up */
const pet=(l,w,r=.6,b=.15)=>`M0,0C${f(w*.9)},${f(-l*b)} ${f(w*1.05)},${f(-l*r)} 0,${f(-l)}C${f(-w*1.05)},${f(-l*r)} ${f(-w*.9)},${f(-l*b)} 0,0Z`;
const rpet=(l,w)=>`M0,0C${f(w*1.3)},${f(-l*.12)} ${f(w*1.25)},${f(-l*1.05)} 0,${f(-l)}C${f(-w*1.25)},${f(-l*1.05)} ${f(-w*1.3)},${f(-l*.12)} 0,0Z`;

/* ---------- timeline engine ---------- */
const tw=[];let T0=0,running=false;
const eo=t=>1-Math.pow(1-t,3);
const eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eb=t=>{const c=1.6;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
function tween(t0,d,fn,e=eo){const w={t0,d,fn,e};tw.push(w);fn(0,0);return w}
function tick(now){if(T0<0)T0=now;const t=now-T0;let act=false;for(const w of tw){if(w.done)continue;if(t<w.t0){act=true;continue}const p=Math.min(1,(t-w.t0)/w.d);w.fn(w.e(p),p);if(p>=1)w.done=true;else act=true}if(act)requestAnimationFrame(tick);else{running=false;finished()}}
function play(){tw.forEach(w=>{w.done=false;w.fn(0,0)});T0=-1;if(!running){running=true;requestAnimationFrame(tick)}}
const tr=(x,y,r,s)=>`translate(${f(x)},${f(y)}) rotate(${f(r)}) scale(${Math.max(s,.0001).toFixed(4)})`;
/* whole flower appears at x,y */
function bloom(el,x,y,r,s,t0,d=1200,spin=-25){tween(t0,d,(e,p)=>el.setAttribute('transform',tr(x,y,r+spin*(1-eo(p)),s*e)),eb);idleAdd({el,k:0,x,y,r,s,a:R(1.2,2.4),b:R(.01,.025)})}
/* inner layer unfolds around its local origin */
function open(el,t0,d=900,spin=20,from=.25){tween(t0,d,(e,p)=>el.setAttribute('transform',`rotate(${f(spin*(1-eo(p)))}) scale(${(from+(1-from)*e).toFixed(4)})`),eb);idleAdd({el,k:1,a:R(2,4.5),b:R(.012,.035)})}

/* ---------- idle life once everything has bloomed ---------- */
let IA=1;const idle=[];let idleOn=false,idleT0=0,idleLast=0;
function idleAdd(m){m.a*=IA;m.b*=Math.min(IA,1.2);m.w=R(.00065,.0012);m.p=R(0,6.283);idle.push(m)}
function idleTick(now){if(!idleOn)return;requestAnimationFrame(idleTick);if(now-idleLast<30)return;idleLast=now;const t=now-idleT0,ramp=Math.min(1,t/2500);
  for(const m of idle){const s1=Math.sin(t*m.w+m.p)*ramp,s2=Math.sin(t*m.w*1.6+m.p*1.7)*ramp;
    m.el.setAttribute('transform',m.k?`rotate(${(m.a*s1).toFixed(2)}) scale(${(1+m.b*s2).toFixed(4)})`:`translate(${f(m.x)},${f(m.y)}) rotate(${(m.r+m.a*s1).toFixed(2)}) scale(${(m.s*(1+m.b*s2)).toFixed(4)})`)}}
function startIdle(){if(RM||idleOn)return;idleOn=true;idleT0=performance.now();idleLast=0;requestAnimationFrame(idleTick)}
/* stroke draws itself */
function grow(el,t0,d=900){const L=Math.ceil(el.getTotalLength())+2;el.setAttribute('stroke-dasharray',L+' '+L);tween(t0,d,e=>el.setAttribute('stroke-dashoffset',f(L*(1-e))),eio)}
function fade(el,t0,d=800,dy=20){tween(t0,d,e=>{el.setAttribute('opacity',e.toFixed(3));el.setAttribute('transform',`translate(0,${f(dy*(1-e))})`)})}

/* ---------- flowers A : tropical structure ---------- */
/* dyed sun-palm fan: opens like a hand fan */
function palmFan(g,t,o){const c=o.c||['#ffd6e6','#ff5fa8','#a3239a'],n=o.n||58,a0=-105,a1=105,secs=8;
  const st=radU([[0,c[0]],[.4,c[1]],[1,c[2]]],104);
  E('circle',{r:19,fill:'none',stroke:st,'stroke-width':5},g);
  E('path',{d:'M0,19 Q-4,40 -2,62',stroke:c[2],'stroke-width':4,fill:'none','stroke-linecap':'round'},g);
  const S=[];for(let i=0;i<secs;i++){const ac=a0+(a1-a0)*(i+.5)/secs,pg=G(g,{transform:`rotate(${f(ac)})`}),sg=G(pg);S.push([sg,ac]);open(sg,t+120+Math.abs(i-3.5)*60,1150,-ac,.55)}
  for(let i=0;i<n;i++){const a=a0+(a1-a0)*i/(n-1),si=Math.min(secs-1,Math.floor((a-a0)/(a1-a0)*secs)),[sg,ac]=S[si];
    const rel=(a-ac)*D,r0=21+R(0,3),r1=96+R(-5,8)-Math.pow(Math.abs(a)/110,3)*28,bend=R(-3,3);
    const x0=Math.sin(rel)*r0,y0=-Math.cos(rel)*r0,x1=Math.sin(rel)*r1,y1=-Math.cos(rel)*r1;
    E('path',{d:`M${f(x0)},${f(y0)}Q${f((x0+x1)/2+bend)},${f((y0+y1)/2)} ${f(x1)},${f(y1)}`,stroke:st,'stroke-width':f(R(1.5,2.6)),'stroke-linecap':'round',fill:'none'},sg)}
}
/* electric-blue dyed palm spears */
function blades(g,t,o){const n=o.n||7,A=o.a||[-40,40],c=o.bc||['#0a2a8a','#1460d8','#3cc0ff'];
  for(let i=0;i<n;i++){const a=A[0]+(A[1]-A[0])*(n==1?.5:i/(n-1))+R(-5,5),len=(o.l||220)*R(.75,1.1),w=(o.bw||16)*R(.8,1.15),bend=R(-35,35);
    const pg=G(g,{transform:`rotate(${f(a)})`}),k=G(pg),P=[[0,0],[bend*.2,-len*.35],[bend*.7,-len*.7],[bend,-len]];
    E('path',{d:taper(P,u=>w*Math.pow(Math.sin(Math.PI*(.12+.88*u)),.8)*(1-u*.35),26),fill:lin(c,0,1,0,0)},k);
    for(const s of[-.5,0,.5])E('path',{d:cp(P.map((p,j)=>[p[0]+s*w*Math.sin(Math.PI*(.12+.88*j/3)),p[1]])),stroke:s?c[2]:'#c6ecff','stroke-width':s?.8:1.2,'stroke-opacity':.55,fill:'none'},k);
    open(k,t+i*60,850,0,0)}
}
/* heliconia (lobster claw) */
function heliconia(g,t,o){const n=o.n||6,H=o.h||210,c=o.hc||['#b50f2a','#ff3b1f','#ff8a1f','#ffd23a'],rim=o.rim||'#c9e24c';
  E('path',{d:taper([[0,0],[4,-H*.3],[-4,-H*.7],[0,-H]],u=>4.5*(1-u*.6),14),fill:'#6b8f2c'},g);
  for(let i=0;i<n;i++){const side=i%2?-1:1,y=-H*(i/n)*.92-6,s=1-i*.11,L=80*s;
    const pg=G(g,{transform:`translate(${side*3},${f(y)}) scale(${side},1) rotate(${-16-i*3})`}),k=G(pg);
    E('path',{d:`M0,0C${f(L*.25)},${f(L*.32)} ${f(L*.8)},${f(L*.22)} ${f(L)},${f(-L*.42)}C${f(L*.72)},${f(-L*.12)} ${f(L*.36)},${f(-L*.16)} 0,${f(-L*.2)}Z`,fill:lin(c,0,0,1,0)},k);
    E('path',{d:`M${f(L*.1)},${f(-L*.06)}C${f(L*.4)},${f(-L*.02)} ${f(L*.7)},${f(-L*.02)} ${f(L*.9)},${f(-L*.3)}`,stroke:'#7a0a1c','stroke-width':f(4*s),'stroke-opacity':.25,fill:'none'},k);
    E('path',{d:`M${f(L*.06)},${f(-L*.17)}C${f(L*.38)},${f(-L*.12)} ${f(L*.72)},${f(-L*.09)} ${f(L*.98)},${f(-L*.4)}`,stroke:rim,'stroke-width':f(3.2*s+1),fill:'none','stroke-linecap':'round'},k);
    E('path',{d:`M${f(L*.14)},${f(L*.07)}C${f(L*.4)},${f(L*.2)} ${f(L*.75)},${f(L*.1)} ${f(L*.93)},${f(-L*.3)}`,stroke:'#fff3b0','stroke-width':1.6,'stroke-opacity':.45,fill:'none'},k);
    open(k,t+150+i*110,800,-35,.15)}
}
/* bird of paradise */
function strelitzia(g,t,o){const sp=['#3f7a33','#6b3d6e','#b0336a','#ee6a86'],se=['#ff4d12','#ff9a1f','#ffd04a'];
  [[-48,96],[-27,114],[-8,108],[12,90]].forEach(([a,l],i)=>{const pg=G(g,{transform:`translate(${56+i*6},-13) rotate(${a})`}),k=G(pg);
    E('path',{d:pet(l,10+i%2*2,.5,.1),fill:lin(se,0,1,0,0)},k);E('path',{d:`M0,-4L0,${f(-l*.9)}`,stroke:'#fff2c0','stroke-opacity':.5,'stroke-width':1},k);
    open(k,t+250+i*120,850,72-a,.2)});
  for(const[a,x]of[[-14,66],[4,74]]){const pg=G(g,{transform:`translate(${x},-14) rotate(${a})`}),k=G(pg);
    E('path',{d:`M0,0C6,-20 5,-50 2,-74C-1,-50 -6,-20 0,0Z`,fill:lin(['#141a8c','#2f4bff','#8fa8ff'],0,1,0,0)},k);open(k,t+650,800,60,0)}
  E('path',{d:'M0,0C40,-12 100,-20 162,-46C126,-10 66,12 0,16Z',fill:lin(sp,0,0,1,0)},g);
  E('path',{d:'M6,2C46,-9 100,-17 150,-39',stroke:'#f6c1d4','stroke-width':1.4,'stroke-opacity':.6,fill:'none'},g);
}
/* anthurium */
function anthurium(g,t,o){const c=o.c||['#fff3a0','#ffb35c','#ff7aa2','#e2457f','#b8245e'],k=G(g);
  E('path',{d:'M0,18C-18,38 -62,40 -70,6C-78,-30 -40,-70 0,-104C40,-70 78,-30 70,6C62,40 18,38 0,18Z',fill:rad(c,.5,.82,.78,.5,.86)},k);
  for(const s of[-1,1])for(const v of[[28,-34,34,-84],[52,-10,58,-44],[24,8,54,6]])E('path',{d:`M0,16Q${s*v[0]},${v[1]} ${s*v[2]},${v[3]}`,stroke:'#a8164f','stroke-opacity':.25,'stroke-width':1.5,fill:'none'},k);
  E('path',{d:'M0,16Q4,-40 0,-100',stroke:'#a8164f','stroke-opacity':.3,'stroke-width':2,fill:'none'},k);
  E('path',{d:'M-36,-46C-32,-70 -16,-84 -5,-91C-17,-70 -23,-58 -27,-38Z',fill:'#fff',opacity:.38},k);
  const sp=G(k),SP=[[0,14],[6,-12],[18,-34],[34,-54]];
  E('path',{d:taper(SP,u=>7*(1-u*.55)+1.5,16),fill:lin(['#ffe066','#ffb020','#ff7a1a'],0,1,1,0)},sp);
  for(let i=0;i<16;i++){const p=bz(SP,i/16);E('circle',{cx:f(p[0]+R(-2.5,2.5)),cy:f(p[1]+R(-2.5,2.5)),r:1.1,fill:'#fff6c0',opacity:.75},sp)}
  open(k,t,1000,-20,.2);open(sp,t+500,700,30,0)}
/* glossy leaf */
function leaf(g,t,o){const l=o.l||90,w=o.lw||26,c=o.lc||['#2f6a2a','#4f9a3a','#9fd35a'],k=G(g);
  E('path',{d:pet(l,w,.55,.12),fill:lin(c,0,1,1,0)},k);
  E('path',{d:`M0,0Q${f(w*.12)},${f(-l*.5)} 0,${f(-l*.97)}`,stroke:'#d8f0a0','stroke-opacity':.6,'stroke-width':1.3,fill:'none'},k);
  for(let i=1;i<6;i++){const y=-l*i/6.5;for(const s of[-1,1])E('path',{d:`M0,${f(y)}Q${f(s*w*.4)},${f(y-l*.06)} ${f(s*w*.75)},${f(y-l*.16)}`,stroke:'#d8f0a0','stroke-opacity':.35,'stroke-width':.9,fill:'none'},k)}
  open(k,t,900,o.ls??25,0)}
/* twisted dyed leaf */
function curl(g,t,o){const P=o.P,w=o.cw||12,c=o.cc||['#5b2a86','#9a6bd6','#d3b8ff'],k=G(g);
  E('path',{d:taper(P,u=>w*(.22+.78*Math.abs(Math.cos(u*Math.PI*(o.tw||1.6))))*(1-u*.7)+.8,44),fill:lin(c,0,1,1,0)},k);
  E('path',{d:cp(P),stroke:c[2],'stroke-opacity':.45,'stroke-width':1,fill:'none'},k);
  open(k,t,1200,o.cs??-12,0)}
/* cut green stalk */
function stalk(g,t,o){const l=o.l||200,w=o.sw||9,k=G(g);
  E('path',{d:`M0,0L0,${-l}`,stroke:'#82ac3e','stroke-width':w},k);
  E('path',{d:`M${-w*.22},0L${-w*.22},${-l}`,stroke:'#d6eb92','stroke-width':1.6,'stroke-opacity':.7},k);
  E('ellipse',{cx:0,cy:-l,rx:w/2,ry:2.2,fill:'#e9f5b8'},k);
  open(k,t,1000,0,0)}

/* ---------- flowers B : blooms & textures ---------- */
/* pompon dahlia: golden-angle spiral of cupped petals */
function dahlia(g,t,o){const c=o.c||['#ffe3f0','#ff86b8','#e0306f','#9c1046'],n=o.n||76,R0=56;
  const k=G(g,{transform:`scale(1,${o.tilt||.9})`});E('circle',{r:R0+14,fill:c[3],opacity:.55},k);
  const rings=[G(k),G(k),G(k)],gO=lin([c[3],c[2],c[1],c[0]]),gI=lin([c[3],c[2],c[1]]),hol=lin([c[3],c[2]]);
  for(let i=n;i>=1;i--){const q=i/n,rr=R0*Math.sqrt(q),a=i*137.508+R(-4,4),len=11+20*q,w=6+6*q;
    const pg=G(rings[q>.62?0:q>.28?1:2],{transform:`rotate(${f(a)}) translate(0,${f(-rr+len*.35)})`});
    E('path',{d:rpet(len,w),fill:q>.28?gO:gI,stroke:c[0],'stroke-width':.7,'stroke-opacity':.55},pg);
    E('path',{d:rpet(len*.55,w*.55),fill:hol,opacity:.55},pg)}
  E('circle',{r:5,fill:c[3]},rings[2]);
  rings.forEach((r,j)=>open(r,t+j*230,1050,(j%2?1:-1)*28,.3))}
/* garden rose */
function rose(g,t,o){const c=o.c||['#fff4ec','#ffd2bf','#f7a08f','#d8616b'],k=G(g,{transform:`scale(1,${o.tilt||.92})`});

  spray(Lmid,[[640,610],[715,560],[790,585],[838,650]],2750,[[.5,lantern,0,.95],[.72,lantern,0,.9],[.95,lantern,0,.8,gl]],{fL:Lmid,stw:2.4});
  [[565,770,1],[692,775,1.1],[470,818,.85],[612,645,.8],[765,825,.9]].forEach(([x,y,s],i)=>put(Lmid,balloon,x,y,0,s,2800+i*110));

/* ---------- heart confetti: many small ones behind the bouquet, a few big ones in front ---------- */
const HB=$('hb'),HF=$('hf'),HC=['#ff4f8b','#ff7aa8','#ff2e63','#ffb3c7','#e91e63','#ff8a5c','#ffc94d','#d66bff','#ff5fd2','#ffd6e6'];
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const rpick=a=>a[Math.floor(Math.random()*a.length)];
function mk(sz,L){const d=document.createElement('div');d.className='h';d.style.width=f(sz)+'px';d.style.height=f(sz*.94)+'px';
  d.innerHTML=`<i style="--a:${f(MR(6,22))}px;--sw:${f(MR(1.6,3.2))}s"><svg viewBox="0 0 32 30" style="--fl:${f(MR(1.8,4.5))}s"><path d="${HP}" fill="${rpick(HC)}"/><ellipse cx="9.5" cy="8" rx="4.2" ry="2.4" fill="#fff" opacity=".45" transform="rotate(-35 9.5 8)"/></svg></i>`;
  L.appendChild(d);return d}
function drop(x,y0,front){const H=innerHeight,sz=front?MR(40,64):MR(10,24),d=mk(sz,front?HF:HB),dist=H+90-y0,dur=dist/((H+120)/(front?MR(5200,7600):MR(8000,13000)));
  if(!front)d.style.opacity=f(MR(.6,.95));
  d.animate([{transform:`translate3d(${f(x)}px,${f(y0)}px,0)`},{transform:`translate3d(${f(x+MR(-90,90))}px,${f(H+90)}px,0)`}],{duration:dur,easing:'linear',fill:'forwards'}).onfinish=()=>d.remove()}
function burst(){const W=innerWidth,H=innerHeight;for(let i=0;i<(RM?24:70);i++)drop(MR(-20,W),MR(-H*1.1,-40));for(let i=0;i<(RM?1:5);i++)drop(MR(0,W-50),MR(-H*1.3,-90),1)}
let rain=0,frontT=0;
function startRain(){clearInterval(rain);clearTimeout(frontT);if(RM)return;
  rain=setInterval(()=>{if(!document.hidden&&HB.childElementCount<60)drop(MR(-20,innerWidth),-40)},300);
  const fr=()=>{if(!document.hidden&&HF.childElementCount<3)drop(MR(0,innerWidth-50),-90,1);frontT=setTimeout(fr,MR(1800,3800))};frontT=setTimeout(fr,1500)}
function pop(x,y){const H=innerHeight;for(let i=0;i<16;i++){const sz=MR(13,30),d=mk(sz,HF),a=MR(-Math.PI,0),v=MR(60,180),dx=Math.cos(a)*v,up=Math.sin(a)*v,ox=x-sz/2,oy=y-sz/2;
  d.animate([{transform:`translate3d(${f(ox)}px,${f(oy)}px,0) scale(.2)`,opacity:0,easing:'cubic-bezier(.2,.8,.3,1)'},{transform:`translate3d(${f(ox+dx)}px,${f(oy+up)}px,0) scale(1)`,opacity:1,offset:.14,easing:'cubic-bezier(.4,0,.9,.7)'},{transform:`translate3d(${f(ox+dx*1.8)}px,${f(H+60)}px,0) scale(1)`,opacity:1}],{duration:MR(4500,7000),fill:'forwards'}).onfinish=()=>d.remove()}}

/* ---------- start ---------- */
function fit(){const W=innerWidth,H=innerHeight,s=Math.min(W/1000,H/1300),ox=(W-1000*s)/2+500*s,oy=(H-1300*s)/2+VY*s;document.querySelectorAll('.sway').forEach(e=>e.style.transformOrigin=`${f(ox)}px ${f(oy)}px`)}
function finished(){document.querySelectorAll('.sway').forEach(e=>e.classList.add('on'));$('replay').classList.add('show');startIdle()}
let timers=[];
function go(){timers.forEach(clearTimeout);idleOn=false;document.querySelectorAll('.sway').forEach(e=>e.classList.remove('on'));$('replay').classList.remove('show');play();timers=[setTimeout(burst,4800),setTimeout(startRain,6500)]}
build();fit();addEventListener('resize',fit);
$('replay').addEventListener('click',e=>{e.stopPropagation();go()});
addEventListener('pointerdown',e=>{if(e.target.closest&&e.target.closest('button'))return;pop(e.clientX,e.clientY)});
Promise.race([document.fonts?document.fonts.ready:Promise.resolve(),new Promise(r=>setTimeout(r,1200))]).then(go);
</script>
